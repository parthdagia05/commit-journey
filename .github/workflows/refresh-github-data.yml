name: Refresh GitHub data

# Rebuilds data/github.json so the skyline and the counters stay current
# without shipping a token to the browser. Runs daily, and on demand.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-github-data.mjs'
      - '.github/workflows/refresh-github-data.yml'

permissions:
  contents: write

concurrency:
  group: refresh-github-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch contributions and merged PRs
        env:
          # GH_PAT (a classic token with read:user) is only needed if the
          # default token cannot read the contribution calendar. The script
          # falls back to GITHUB_TOKEN, which covers the PR search either way.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github-data.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/github.json; then
            echo "No change in data/github.json"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git commit -m "chore: refresh GitHub data"
          git push
